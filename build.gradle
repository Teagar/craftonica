import net.minecraftforge.gradle.delayed.DelayedString

buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT"
    }
}

apply plugin: "forge"

version = "0.3.2"
group = "br.com.craftonica"
archivesBaseName = "craftonica"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    if (project.hasProperty("craftonicaAssetDir")) {
        assetDir = project.property("craftonicaAssetDir")
    }
}

afterEvaluate {
    // ForgeGradle 1.2 still points at Mojang's retired HTTP S3 endpoint.
    tasks.downloadClient.setUrl(new DelayedString(project, "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar"))
    tasks.downloadServer.setUrl(new DelayedString(project, "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar"))
    tasks.getVersionJson.setUrl(new DelayedString(project, "https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json"))
    tasks.getAssetsIndex.setUrl(new DelayedString(project, "https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json"))

    if (project.hasProperty("skipAssets")) {
        tasks.getAssetsIndex.enabled = false
        tasks.getAssets.enabled = false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile "junit:junit:4.13.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

task verifyReleaseJar(dependsOn: reobf) << {
    def jarFile = file("${buildDir}/libs/${archivesBaseName}-${version}.jar")
    def archive = new java.util.zip.ZipFile(jarFile)
    try {
        def entry = archive.getEntry("br/com/craftonica/block/BlockElectricalWire.class")
        def bytes = archive.getInputStream(entry).bytes
        def constants = new String(bytes, "ISO-8859-1")
        if (constants.contains("circuits") || !constants.contains("field_151594_q")) {
            throw new GradleException("Release JAR is not reobfuscated for Forge runtime")
        }
    } finally {
        archive.close()
    }
}

build.dependsOn verifyReleaseJar
