import net.minecraftforge.gradle.delayed.DelayedString

buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT"
    }
}

apply plugin: "forge"

version = "1.0.0"
group = "br.com.craftonica"
archivesBaseName = "craftonica"

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
    if (project.hasProperty("craftonicaAssetDir")) {
        assetDir = project.property("craftonicaAssetDir")
    }
}

afterEvaluate {
    // ForgeGradle 1.2 still points at Mojang's retired HTTP S3 endpoint.
    tasks.downloadClient.setUrl(new DelayedString(project, "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar"))
    tasks.downloadServer.setUrl(new DelayedString(project, "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar"))
    tasks.getVersionJson.setUrl(new DelayedString(project, "https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json"))
    tasks.getAssetsIndex.setUrl(new DelayedString(project, "https://launchermeta.mojang.com/v1/packages/1863782e33ce7b584fc45b037325a1964e095d3e/1.7.10.json"))

    if (project.hasProperty("skipAssets")) {
        tasks.getAssetsIndex.enabled = false
        tasks.getAssets.enabled = false
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile "junit:junit:4.13.2"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include "mcmod.info"
        expand "version": project.version, "mcversion": project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude "mcmod.info"
    }
}

task verifyReleaseJar(dependsOn: reobf) << {
    def jarFile = file("${buildDir}/libs/${archivesBaseName}-${version}.jar")
    def archive = new java.util.zip.ZipFile(jarFile)
    try {
        def entry = archive.getEntry("br/com/craftonica/block/BlockElectricalWire.class")
        def bytes = archive.getInputStream(entry).bytes
        def constants = new String(bytes, "ISO-8859-1")
        if (constants.contains("circuits") || !constants.contains("field_151594_q")) {
            throw new GradleException("Release JAR is not reobfuscated for Forge runtime")
        }
    } finally {
        archive.close()
    }
}

task verifyReleaseMetadata(dependsOn: processResources) << {
    def release = version.toString()
    def source = file("src/main/java/br/com/craftonica/Craftonica.java").getText("UTF-8")
    def metadata = file("${buildDir}/resources/main/mcmod.info").getText("UTF-8")
    def readme = file("README.md").getText("UTF-8")
    if (!source.contains("VERSION = \"${release}\""))
        throw new GradleException("Craftonica.VERSION differs from project version ${release}")
    if (!metadata.contains("\"version\": \"${release}\""))
        throw new GradleException("Processed mcmod.info differs from project version ${release}")
    if (!readme.contains("Craftônica: Robotics Lab ${release}")
            || !readme.contains("craftonica-${release}.jar"))
        throw new GradleException("README release metadata differs from project version ${release}")
}

task verifyElectricalGates(type: Test, dependsOn: testClasses) {
    include "**/ElectricalSimulationGateTest.class"
    include "**/DenseLuSolverTest.class"
    include "**/ResistanceMeasurementTest.class"
    include "**/ItemMultimeterMeasurementTest.class"
}

task verifyFirmwareGates(type: Test, dependsOn: testClasses) {
    include "**/firmware/*Test.class"
}

task verifyMigrationGates(type: Test, dependsOn: testClasses) {
    include "**/persistence/*Test.class"
    include "**/item/ItemMultimeterMigrationTest.class"
    include "**/lesson/LessonProgressDataTest.class"
    include "**/lesson/TeacherActivityTest.class"
}

task firmwareIntegration(type: Test, dependsOn: testClasses) {
    include "**/firmware/FirmwareCompilerIntegrationTest.class"
    systemProperty "craftonica.firmware.integration", "true"
}

task runtimeWorkerJar(type: Jar, dependsOn: classes) {
    classifier = "runtime-worker"
    destinationDir = file("${buildDir}/runtime")
    from sourceSets.main.output
    include "br/com/craftonica/firmware/**"
    include "br/com/craftonica/runtime/core/**"
    include "br/com/craftonica/runtime/protocol/**"
    include "br/com/craftonica/runtime/worker/**"
    manifest { attributes "Main-Class": "br.com.craftonica.runtime.worker.RuntimeWorkerMain" }
}

task verifyRuntimeGates(type: Test, dependsOn: [testClasses, runtimeWorkerJar]) {
    include "**/runtime/core/*Test.class"
    include "**/runtime/protocol/*Test.class"
    include "**/runtime/worker/*Test.class"
    include "**/runtime/server/*Test.class"
    include "**/tile/RoboBoardStateTest.class"
    include "**/tile/TileEntityRoboBoardBudgetTest.class"
    systemProperty "craftonica.runtime.firmware.integration", "true"
    systemProperty "craftonica.runtime.workerJar", runtimeWorkerJar.archivePath
    systemProperty "craftonica.runtime.launcher", file("scripts/runtime/launch-worker.sh")
    systemProperty "craftonica.runtime.javaHome", System.getProperty("java.home")
}

task electricalProfile(dependsOn: verifyElectricalGates) << {
    def report = file("${buildDir}/reports/electrical/crl-26-profile.txt")
    report.parentFile.mkdirs()
    report.text = """Craftonica electrical deterministic profile v1
maxBlocks=1024
maxTerminals=6144
maxBranches=2048
maxUnknownsPerNetwork=256
maxMatrixCells=65536
maxActiveLeds=64
maxActiveSetIterations=16
maxNetworksPerTick=4
maxUnknownsPerTick=512
topologyContactLookup=O(terminals)
auxiliaryResistanceSourceVolts=1
auxiliaryNonlinearPolicy=reject
wallClockGate=false
"""
}

build.dependsOn verifyReleaseJar
build.dependsOn verifyReleaseMetadata
build.dependsOn verifyElectricalGates
build.dependsOn verifyFirmwareGates
build.dependsOn verifyRuntimeGates
build.dependsOn verifyMigrationGates
